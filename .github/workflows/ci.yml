name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6 无头渲染所需的系统库（offscreen 平台）
      - name: Install Qt headless system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libglib2.0-0 \
            libdbus-1-3 libfontconfig1

      - name: Install package (all extras + test toolchain)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, offscreen Qt)
        run: pytest tests/ -v
